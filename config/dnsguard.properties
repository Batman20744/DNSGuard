
# DNSGuard detection rules

# Maximum permitted domain length
domain.length.threshold=30

# Shannon entropy threshold (0 to 5)
entropy.threshold=3.2

# Repeated queries to the same domain
query.repeated.threshold=10

# Shared time window for frequency-based rules, in seconds
detection.window.seconds=60

# Unique subdomain threshold
subdomain.unique.threshold=10

# Total DNS queries allowed per source IP in the window
query.rate.threshold=100

# TXT queries allowed per source IP and domain in the shared time window
query.txt.repeated.threshold=2
